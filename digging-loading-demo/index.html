<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DIGGING loading prototype" />
    <title>Digging</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@500;600&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div class="hud">
        <div class="hud-topline" aria-live="polite">
          <span class="loading-word">Digging</span>
          <span class="loading-dots"></span>
        </div>
        <div class="hud-depth">
          <span id="depth-value" class="value">0000</span>
        </div>
      </div>

      <button id="replay-btn" type="button" aria-label="Replay loading animation">REPLAY</button>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
